syntax = "proto3";

// The agentkit.sandbox.v1 protocol: the host talks to the AgentKit agent
// inside a sandbox (agentkit-sandboxd) over this one service.
//
// Fields are added, never renumbered, and any addition bumps
// sandbox.ProtocolMinor. CallRequest and CallResponse reference no other
// message and no session state, so a later script stream can reuse them as
// frames. Tool input, result data and result metadata are JSON bytes, never
// proto structs.
//
// After an edit, run `make proto`: it regenerates the Go code beside this
// file and records this file's SHA-256 in sandbox.proto.sha256.

package agentkit.sandbox.v1;

option go_package = "github.com/agent-fox-dev/agentkit-go/sandbox/internal/sandboxpb;sandboxpb";

service Agent {
  // Protocol and agent versions, workspace root, outline backend, git present.
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Configure the tool set; returns each tool's name and definition digest.
  rpc Tools(ToolsRequest) returns (ToolsResponse);
  // Run one tool call.
  rpc Call(CallRequest) returns (CallResponse);
  // First chunk: target path and replace flag; then tar bytes.
  rpc SyncTar(stream TarChunk) returns (SyncResponse);
  // A tar stream of a workspace subtree.
  rpc ExportTar(ExportRequest) returns (stream TarChunk);
  // One LocalDir transfer over the rsync protocol. Frame order: the host
  // sends start, the agent answers plan, the host sends args, data frames
  // flow both ways, the agent sends done and ends the RPC with status OK.
  // One stream carries all state of one transfer.
  rpc Rsync(stream RsyncFrame) returns (stream RsyncFrame);
}

message HelloRequest {}

message HelloResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string version = 3;
  string workdir = 4;
  string outline_backend = 5;
  bool git = 6;
  // landlock is the Landlock ruleset the agent applied to its own process;
  // protocol 1.2 added it.
  LandlockReport landlock = 7;
}

// LandlockReport is what the agent's Landlock confinement applied: the ABI
// of the ruleset (0 when none), the ABI the kernel offered, whether TCP bind
// and connect are denied, why nothing or only part was applied, and the
// resolved roots of the ruleset.
message LandlockReport {
  uint32 abi = 1;
  uint32 kernel_abi = 2;
  bool tcp = 3;
  string note = 4;
  repeated string writable = 5;
  repeated string read_only = 6;
}

message ToolsRequest {
  int64 symbols_max_files = 1;
  int64 symbols_max_duration_nanos = 2;
  string spill_dir = 3;
  bool disable_spill = 4;
}

message ToolInfo {
  string name = 1;
  bytes digest = 2;
}

message ToolsResponse {
  repeated ToolInfo tools = 1;
}

message CallRequest {
  string name = 1;
  bytes input = 2;  // JSON
}

message CallResponse {
  bool ok = 1;
  bytes data = 2;  // JSON object, or empty
  string error = 3;
  string detail = 4;
  bytes metadata = 5;  // JSON core.ToolMetadata, or empty
  string text = 6;
}

message TarStart {
  string path = 1;
  bool replace = 2;
}

message TarChunk {
  oneof body {
    TarStart start = 1;
    bytes data = 2;  // at most 1 MiB
  }
}

message SyncResponse {
  int64 files = 1;
  int64 bytes = 2;
}

message ExportRequest {
  string path = 1;
}

message RsyncStart {
  enum Direction {
    DIRECTION_UNSPECIFIED = 0;
    SYNC = 1;
    EXPORT = 2;
  }
  Direction direction = 1;
  string path = 2;
  bool include_ignored = 3;
  bool exclude_git = 4;
  bool delete = 5;
}

message RsyncPlan {
  repeated string rules = 1;  // the agent's exclude rules, workspace-relative
  bool file = 2;              // the export path names a regular file
}

message RsyncArgs {
  // The agent's side of the transfer in rsync server-argument form.
  repeated string args = 1;
  // The combined exclude rules, applied by AgentKit on both sides; the rsync
  // library never sees them.
  repeated string rules = 2;
  // On SYNC with delete: the host sender's transfer set, from which the
  // agent decides what to delete.
  repeated string present = 3;
}

message RsyncDone {
  int64 files = 1;
  int64 bytes = 2;
  int64 deleted = 3;
  // On EXPORT with delete: the agent sender's transfer set, from which the
  // host decides what to delete.
  repeated string present = 4;
}

message RsyncFrame {
  oneof frame {
    RsyncStart start = 1;
    RsyncPlan plan = 2;
    RsyncArgs args = 3;
    bytes data = 4;  // at most 1 MiB
    RsyncDone done = 5;
  }
}
