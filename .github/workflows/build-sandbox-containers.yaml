name: agentkit sandbox containers build

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
      
  workflow_dispatch:

jobs:
  build-sandbox-container:
    uses: ./.github/workflows/inc-build.yaml
    with:
      container_name: agentkit-sandbox
    secrets: inherit
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
